# CocaTrace - Practica 2: MQTT (Mosquitto) -> InfluxDB 2 + CSV
# Se instala como /etc/telegraf/telegraf.conf en la EC2 publica.
# Las claves vienen de /etc/default/telegraf (no se suben a GitHub):
#   MQTT_TELEGRAF_PASS=...
#   INFLUX_TOKEN=...      (token con permiso SOLO de escritura en el bucket "secado")

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# Lecturas del ESP32.
#   topic:   <secadero>/temperatura  o  <secadero>/humedad
#   mensaje: {"valor": 24.6, "ts": 1793461967}   (ts = hora de la medicion, epoch UTC)
# Se usa la hora del ESP32 y no la de llegada, para que las lecturas que estaban
# en el buffer del ESP32 conserven su hora real.
[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["+/temperatura", "+/humedad"]
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASS}"
  client_id = "telegraf-cocatrace"
  # QoS 1 + sesion persistente: si Telegraf se reinicia, el broker le guarda los mensajes
  qos = 1
  persistent_session = true
  topic_tag = ""
  name_override = "ambiente"
  data_format = "json_v2"
  # secadero1/temperatura -> tags secadero=secadero1, variable=temperatura
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+"
    tags = "secadero/variable"
  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "unix"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "valor"
      type = "float"

# Descarta variables desconocidas y valores fuera del rango del DHT22
[[processors.starlark]]
  source = '''
RANGOS = {"temperatura": (-40.0, 80.0), "humedad": (0.0, 100.0)}
def apply(metric):
    r = RANGOS.get(metric.tags.get("variable"))
    v = metric.fields.get("valor")
    if r == None or v == None or v < r[0] or v > r[1]:
        return None
    return metric
'''

# Base de datos de series de tiempo, en la subred privada
[[outputs.influxdb_v2]]
  urls = ["http://10.0.132.68:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "cocatrace"
  bucket = "secado"

# Respaldo en CSV
[[outputs.file]]
  files = ["/var/lib/telegraf/mediciones.csv"]
  data_format = "csv"
  csv_header = true
  csv_timestamp_format = "2006-01-02T15:04:05Z07:00"
  csv_columns = ["timestamp", "tag.secadero", "tag.variable", "field.valor"]
